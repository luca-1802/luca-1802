name: Refresh public profile

on:
  workflow_dispatch:
  schedule:
    - cron: '20 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate collector and renderer
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Collect current public data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect_public.py
      - name: Render Manifest editions
        run: python scripts/render_profile.py
      - name: Commit updated assets
        run: |
          git add -- assets/
          if git diff --cached --quiet; then
            echo 'Public profile assets are unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile manifest'
          git push origin HEAD:main
