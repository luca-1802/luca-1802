<svg xmlns="http://www.w3.org/2000/svg" width="480" height="316" viewBox="0 0 480 316" role="img" aria-labelledby="title desc">
<title id="title">Profile boot sequence</title><desc id="desc">A decorative boot sequence introduces Luca’s software tools, public repositories and GitHub profile. This is an animation, not a build or health report.</desc>
<defs><style>
text{font-family:'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.cursor{animation:blink 1.2s step-end infinite}
.orbit{transform-origin:80px 80px;animation:orbit 32s linear infinite}
.scan{animation:scan 9s linear infinite}
.boot{animation:boot 16s linear infinite;animation-delay:var(--delay,0s)}
.meter{transform-box:fill-box;transform-origin:left;animation:meter 1.2s ease-out both}
.rowlight{animation:rowlight 10s ease-in-out infinite;animation-delay:var(--delay,0s)}
.tick{opacity:0;animation:tick 15s linear infinite;animation-delay:var(--delay,0s)}
.tick.first{opacity:1}
.hexlight{animation:hexlight 12s steps(7,end) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(440px)}}
@keyframes boot{0%,3%{opacity:.16}8%,85%{opacity:1}92%,100%{opacity:.16}}
@keyframes meter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rowlight{0%,8%,100%{opacity:0}15%,28%{opacity:.12}35%,95%{opacity:0}}
@keyframes tick{0%,29%{opacity:1}33%,100%{opacity:0}}
@keyframes hexlight{from{transform:translateY(0)}to{transform:translateY(196px)}}
@media(prefers-reduced-motion:reduce){
 .pulse,.cursor,.orbit,.scan,.boot,.meter,.rowlight,.tick,.hexlight{animation:none!important}
 .scan,.rowlight,.hexlight{display:none}.tick{opacity:0}.tick.first{opacity:1}
}
</style>
<pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#75baff" opacity=".065"/></pattern>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3H4" stroke="#000" opacity=".15"/></pattern>
<linearGradient id="scan"><stop stop-color="#75baff" stop-opacity="0"/><stop offset=".5" stop-color="#75baff" stop-opacity=".09"/><stop offset="1" stop-color="#75baff" stop-opacity="0"/></linearGradient>
<clipPath id="bounds"><rect width="480" height="316"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect x="0" y="0" width="480" height="316" fill="#080c12" /><rect x="0" y="0" width="480" height="316" fill="url(#noise)" /><rect x="0" y="0" width="480" height="36" fill="#0e1621" /><path d="M0 36H480" stroke="#253448" /><text x="16" y="24" font-size="16" fill="#75baff" >profile.init()</text><g class="boot" style="--delay:0.0s"><text x="17" y="70" font-size="14" fill="#8b9fb8" >00.018</text><text x="89" y="70" font-size="15" fill="#75baff" >mount  </text><text x="171" y="70" font-size="15" fill="#ecf3ff" >/home/luca</text></g><g class="boot" style="--delay:0.6s"><text x="17" y="102" font-size="14" fill="#8b9fb8" >00.042</text><text x="89" y="102" font-size="15" fill="#75baff" >load   </text><text x="171" y="102" font-size="15" fill="#ecf3ff" >Python · TypeScript</text></g><g class="boot" style="--delay:1.2s"><text x="17" y="134" font-size="14" fill="#8b9fb8" >00.106</text><text x="89" y="134" font-size="15" fill="#75baff" >attach </text><text x="171" y="134" font-size="15" fill="#ecf3ff" >React · Docker · Git</text></g><g class="boot" style="--delay:1.7999999999999998s"><text x="17" y="166" font-size="14" fill="#8b9fb8" >00.184</text><text x="89" y="166" font-size="15" fill="#75baff" >index  </text><text x="171" y="166" font-size="15" fill="#ecf3ff" >public repositories</text></g><g class="boot" style="--delay:2.4s"><text x="17" y="198" font-size="14" fill="#8b9fb8" >00.256</text><text x="89" y="198" font-size="15" fill="#75baff" >start  </text><text x="171" y="198" font-size="15" fill="#ecf3ff" >interactive session</text></g><g class="boot" style="--delay:3.0s"><text x="17" y="230" font-size="14" fill="#8b9fb8" >00.512</text><text x="89" y="230" font-size="15" fill="#75baff" >ready  </text><text x="171" y="230" font-size="15" fill="#ecf3ff" >luca-1802@github</text></g><path d="M0 287H480" stroke="#253448" /><text x="16" y="306" font-size="12" fill="#8b9fb8" >profile boot animation</text><rect x="0" y="0" width="480" height="316" fill="url(#lines)" pointer-events="none"/><rect x="0.5" y="0.5" width="479" height="315" fill="none" stroke="#253448"/></g></svg>
