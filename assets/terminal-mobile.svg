<svg xmlns="http://www.w3.org/2000/svg" width="480" height="420" viewBox="0 0 480 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Luca — developer terminal</title>
  <desc id="desc">An animated terminal introduction. Luca: building things, one commit at a time. Python, TypeScript, React, and CLI tools.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#8ff0c8" stroke-opacity=".035"/></pattern>
    <clipPath id="terminal"><rect x=".5" y=".5" width="479" height="419" rx="14"/></clipPath>
    <clipPath id="command"><rect class="typing" x="50" y="77" width="171" height="28"/></clipPath>
    <style>
      text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .typing { animation: type 1.4s steps(15,end) .25s both; }
      .caret { animation: advance 1.4s steps(15,end) .25s both; transform: translateX(173px); }
      .intro { animation: reveal .7s ease-out .2s both; }
      .detail { animation: reveal .7s ease-out .5s both; }
      .cursor { animation: blink .8s step-end 5; }
      @keyframes type { from { width: 0; } to { width: 171px; } }
      @keyframes advance { from { transform: translateX(0); } to { transform: translateX(173px); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .typing, .caret, .intro, .detail, .cursor { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#terminal)">
    <rect width="480" height="420" fill="#10141b"/>
    <rect y="47" width="480" height="331" fill="url(#grid)"/>
    <path d="M0 47H480M0 378H480" stroke="#283140"/>
    <circle cx="25" cy="24" r="5" fill="#fa8072"/>
    <circle cx="43" cy="24" r="5" fill="#e7c477"/>
    <circle cx="61" cy="24" r="5" fill="#8ff0c8"/>
    <text x="87" y="29" fill="#a6b2c2" font-size="14">luca@github: ~</text>
    <text x="449" y="30" text-anchor="end" fill="#8ff0c8" font-size="18">&lt;/&gt;</text>
    <text x="24" y="98" fill="#8ff0c8" font-size="19">❯</text>
    <text x="50" y="98" fill="#bac4d0" font-size="19" textLength="171" lengthAdjust="spacingAndGlyphs" clip-path="url(#command)">./hello --world</text>
    <g class="caret"><rect class="cursor" x="50" y="83" width="10" height="18" rx="1" fill="#8ff0c8"/></g>
    <g class="intro">
      <text x="21" y="218" fill="#edf3f8" font-size="106" font-weight="700" letter-spacing="-7">Luca<tspan fill="#8ff0c8">.</tspan></text>
      <text x="26" y="264" fill="#edf3f8" font-size="25" letter-spacing="-.7">Building things.</text>
      <text x="26" y="299" fill="#a6b2c2" font-size="25" letter-spacing="-.7">One commit at a time.</text>
    </g>
    <text class="detail" x="26" y="347" fill="#bac4d0" font-size="16"><tspan fill="#8ff0c8">Python</tspan> / TypeScript / React / CLI</text>
    <path d="M0 378H180L194 399L180 420H0" fill="#8ff0c8"/>
    <text x="23" y="404" fill="#10141b" font-size="15" font-weight="700">~/luca-1802</text>
    <text x="451" y="404" text-anchor="end" fill="#bac4d0" font-size="14">git:main</text>
  </g>
  <rect x=".5" y=".5" width="479" height="419" rx="14" stroke="#283140"/>
</svg>
