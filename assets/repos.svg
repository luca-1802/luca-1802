<svg xmlns="http://www.w3.org/2000/svg" width="960" height="238" viewBox="0 0 960 238" role="img" aria-labelledby="title desc">
<title id="title">Public repository table</title><desc id="desc">Original public repositories, showing language, stars, forks and last push. password-manager, file-organizer, weather-cli</desc>
<defs><style>
text{font-family:'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace}
.pulse{animation:pulse 2.8s ease-in-out infinite}
.cursor{animation:blink 1.2s step-end infinite}
.orbit{transform-origin:80px 80px;animation:orbit 32s linear infinite}
.scan{animation:scan 9s linear infinite}
.boot{animation:boot 16s linear infinite;animation-delay:var(--delay,0s)}
.meter{transform-box:fill-box;transform-origin:left;animation:meter 1.2s ease-out both}
.rowlight{animation:rowlight 10s ease-in-out infinite;animation-delay:var(--delay,0s)}
.tick{opacity:0;animation:tick 15s linear infinite;animation-delay:var(--delay,0s)}
.tick.first{opacity:1}
.hexlight{animation:hexlight 12s steps(7,end) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(440px)}}
@keyframes boot{0%,3%{opacity:.16}8%,85%{opacity:1}92%,100%{opacity:.16}}
@keyframes meter{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rowlight{0%,8%,100%{opacity:0}15%,28%{opacity:.12}35%,95%{opacity:0}}
@keyframes tick{0%,29%{opacity:1}33%,100%{opacity:0}}
@keyframes hexlight{from{transform:translateY(0)}to{transform:translateY(196px)}}
@media(prefers-reduced-motion:reduce){
 .pulse,.cursor,.orbit,.scan,.boot,.meter,.rowlight,.tick,.hexlight{animation:none!important}
 .scan,.rowlight,.hexlight{display:none}.tick{opacity:0}.tick.first{opacity:1}
}
</style>
<pattern id="noise" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".45" fill="#75baff" opacity=".065"/></pattern>
<pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3H4" stroke="#000" opacity=".15"/></pattern>
<linearGradient id="scan"><stop stop-color="#75baff" stop-opacity="0"/><stop offset=".5" stop-color="#75baff" stop-opacity=".09"/><stop offset="1" stop-color="#75baff" stop-opacity="0"/></linearGradient>
<clipPath id="bounds"><rect width="960" height="238"/></clipPath></defs>
<g clip-path="url(#bounds)"><rect x="0" y="0" width="960" height="238" fill="#080c12" /><rect x="0" y="0" width="960" height="238" fill="url(#noise)" /><rect x="0" y="0" width="960" height="36" fill="#0e1621" /><path d="M0 36H960" stroke="#253448" /><text x="16" y="24" font-size="13" fill="#75baff" >top --public --no-forks</text><text x="944" y="24" font-size="11" fill="#8b9fb8" text-anchor="end">REPOSITORY TABLE</text><text x="18" y="68" font-size="12" fill="#8b9fb8" >REPOSITORY</text><text x="434" y="68" font-size="12" fill="#8b9fb8" >LANGUAGE</text><text x="638" y="68" font-size="12" fill="#8b9fb8" >STARS</text><text x="742" y="68" font-size="12" fill="#8b9fb8" >FORKS</text><text x="835" y="68" font-size="12" fill="#8b9fb8" >PUSHED</text><path d="M12 80H948" stroke="#253448" /><rect x="12" y="86" width="936" height="31" fill="#75baff" class="rowlight" style="--delay:0s" opacity="0"/><text x="18" y="107" font-size="15" fill="#ecf3ff" font-weight="700">password-manager</text><text x="434" y="107" font-size="14" fill="#75baff" >TypeScript</text><text x="638" y="107" font-size="14" fill="#ecf3ff" >2</text><text x="742" y="107" font-size="14" fill="#ecf3ff" >0</text><text x="835" y="107" font-size="12" fill="#8b9fb8" >2026-03-02</text><rect x="12" y="124" width="936" height="31" fill="#75baff" class="rowlight" style="--delay:2s" opacity="0"/><text x="18" y="145" font-size="15" fill="#ecf3ff" font-weight="700">file-organizer</text><text x="434" y="145" font-size="14" fill="#75baff" >Python</text><text x="638" y="145" font-size="14" fill="#ecf3ff" >0</text><text x="742" y="145" font-size="14" fill="#ecf3ff" >0</text><text x="835" y="145" font-size="12" fill="#8b9fb8" >2026-02-22</text><rect x="12" y="162" width="936" height="31" fill="#75baff" class="rowlight" style="--delay:4s" opacity="0"/><text x="18" y="183" font-size="15" fill="#ecf3ff" font-weight="700">weather-cli</text><text x="434" y="183" font-size="14" fill="#75baff" >Python</text><text x="638" y="183" font-size="14" fill="#ecf3ff" >0</text><text x="742" y="183" font-size="14" fill="#ecf3ff" >0</text><text x="835" y="183" font-size="12" fill="#8b9fb8" >2026-02-22</text><path d="M0 209H960" stroke="#253448" /><text x="16" y="228" font-size="11" fill="#8b9fb8" >3 original public projects</text><text x="944" y="228" font-size="11" fill="#8b9fb8" text-anchor="end">updated 2026-09-06</text><rect x="0" y="0" width="960" height="238" fill="url(#lines)" pointer-events="none"/><rect x="0.5" y="0.5" width="959" height="237" fill="none" stroke="#253448"/></g></svg>
