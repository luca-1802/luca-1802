<svg xmlns="http://www.w3.org/2000/svg" width="960" height="416" viewBox="0 0 960 416" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Luca — developer terminal</title>
  <desc id="desc">An animated terminal introduction. Luca: building things, one commit at a time. Python, TypeScript, React, and CLI tools.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#8ff0c8" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="terminal"><rect x=".5" y=".5" width="959" height="415" rx="16"/></clipPath>
    <clipPath id="command"><rect class="typing" x="67" y="77" width="171" height="28"/></clipPath>
    <style>
      text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .typing { animation: type 1.4s steps(15,end) .25s both; }
      .caret { animation: advance 1.4s steps(15,end) .25s both; transform: translateX(173px); }
      .intro { animation: reveal .7s ease-out .2s both; }
      .detail { animation: reveal .7s ease-out .5s both; }
      .symbol { animation: reveal 1s ease-out .7s both; }
      .cursor { animation: blink .8s step-end 5; }
      .trace { stroke-dasharray: 1; stroke-dashoffset: 0; animation: trace 1.7s ease-out .5s both; }
      @keyframes type { from { width: 0; } to { width: 171px; } }
      @keyframes advance { from { transform: translateX(0); } to { transform: translateX(173px); } }
      @keyframes reveal { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .typing, .caret, .intro, .detail, .symbol, .cursor, .trace { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#terminal)">
    <rect width="960" height="416" fill="#10141b"/>
    <rect y="47" width="960" height="327" fill="url(#grid)"/>
    <path d="M0 47H960M0 374H960" stroke="#283140"/>
    <circle cx="25" cy="24" r="5" fill="#fa8072"/>
    <circle cx="43" cy="24" r="5" fill="#e7c477"/>
    <circle cx="61" cy="24" r="5" fill="#8ff0c8"/>
    <text x="88" y="29" fill="#a6b2c2" font-size="13">luca@github: ~</text>
    <text x="918" y="29" text-anchor="end" fill="#8b98a9" font-size="11" letter-spacing="1.5">PROFILE / 01</text>

    <text x="38" y="98" fill="#8ff0c8" font-size="19">❯</text>
    <text x="67" y="98" fill="#bac4d0" font-size="19" textLength="171" lengthAdjust="spacingAndGlyphs" clip-path="url(#command)">./hello --world</text>
    <g class="caret"><rect class="cursor" x="67" y="83" width="10" height="18" rx="1" fill="#8ff0c8"/></g>

    <g class="intro">
      <text x="36" y="216" fill="#edf3f8" font-size="104" font-weight="700" letter-spacing="-7">Luca<tspan fill="#8ff0c8">.</tspan></text>
      <text x="40" y="263" fill="#edf3f8" font-size="25" letter-spacing="-.6">Building things.</text>
      <text x="40" y="297" fill="#a6b2c2" font-size="25" letter-spacing="-.6">One commit at a time.</text>
    </g>

    <g class="detail" font-size="13">
      <text x="40" y="343" fill="#8ff0c8">Python</text>
      <text x="116" y="343" fill="#536275">/</text>
      <text x="139" y="343" fill="#bac4d0">TypeScript</text>
      <text x="247" y="343" fill="#536275">/</text>
      <text x="270" y="343" fill="#bac4d0">React</text>
      <text x="337" y="343" fill="#536275">/</text>
      <text x="360" y="343" fill="#bac4d0">CLI tools</text>
    </g>

    <g class="symbol">
      <path d="M604 105V329" stroke="#283140"/>
      <text x="650" y="126" fill="#8b98a9" font-size="11" letter-spacing="2">IDEA → CODE → COMMIT</text>
      <path d="M710 174L666 215L710 256M834 174L878 215L834 256M794 157L750 273" stroke="#8ff0c8" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
      <path class="trace" pathLength="1" d="M650 306H688L700 294H755L767 306H880" stroke="#8ff0c8" stroke-opacity=".5"/>
      <rect x="880" y="303" width="6" height="6" fill="#8ff0c8"/>
    </g>

    <path d="M0 374H169L184 395L169 416H0" fill="#8ff0c8"/>
    <text x="22" y="400" fill="#10141b" font-size="13" font-weight="700">~/luca-1802</text>
    <text x="207" y="400" fill="#bac4d0" font-size="12">git:main</text>
    <text x="921" y="400" text-anchor="end" fill="#8b98a9" font-size="12">UTF-8  /  LF</text>
  </g>
  <rect x=".5" y=".5" width="959" height="415" rx="16" stroke="#283140"/>
</svg>
